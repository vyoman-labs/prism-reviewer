name: Prism Reviewer AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so git diff can compare against target branch
          fetch-depth: 0

      - name: Execute Prism Reviewer Action
        uses: ./
        with:
          llm-api-key: ${{ secrets.LLM_PROVIDER_API_KEY }}
          llm-model-name: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'gemini/gemini-3.1-flash-lite' }}
          app-id: ${{ secrets.PRISM_REVIEWER_APP_ID }}
          private-key: ${{ secrets.PRISM_REVIEWER_PRIVATE_KEY }}
