# .github/workflows/prism-reviewer.yml
# Copy this file into your repository under .github/workflows/ to enable automated AI code reviews on Pull Requests!

name: Prism Reviewer AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run Prism Reviewer AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          # Fetch all history for precise git diff calculations against base branch
          fetch-depth: 0

      - name: Run Prism Reviewer AI
        uses: vyoman-labs/prism-reviewer@v1.1.0
        with:
          # =========================================================================
          # Required Inputs
          # =========================================================================
          # API key for your LLM Provider (Gemini, OpenRouter, OpenAI, Anthropic, etc.)
          llm-api-key: ${{ secrets.LLM_PROVIDER_API_KEY }}

          # =========================================================================
          # Optional LLM & Execution Inputs
          # =========================================================================
          # LiteLLM model identifier (defaults to gemini/gemini-3.1-flash-lite)
          # llm-model-name: 'gemini/gemini-3.1-flash-lite'

          # Base branch or commit reference for comparison (defaults to github.base_ref)
          # base-ref: ${{ github.base_ref }}

          # Execution mode for review agents ('parallel' or 'sequential', defaults to 'parallel')
          # agents-mode: 'parallel'

          # Custom GitHub token (PAT, App installation token, or default GITHUB_TOKEN)
          # Default: ${{ github.token }} (posts comments as github-actions[bot])
          # github-token: ${{ secrets.GITHUB_TOKEN }}

          # =========================================================================
          # Optional GitHub App Authentication Inputs
          # (Used to generate installation token if github-token is not set)
          # =========================================================================
          # app-id: ${{ secrets.PRISM_REVIEWER_APP_ID }}
          # private-key: ${{ secrets.PRISM_REVIEWER_PRIVATE_KEY }}
          # owner: ${{ github.repository_owner }}

          # Control telemetry package installation ('auto', 'true', or 'false', defaults to 'auto')
          # enable-monitoring: 'auto'

        # =========================================================================
        # Optional Telemetry & Observability Credentials
        # Pass telemetry secrets/host endpoints here if using Langfuse or OpenTelemetry
        # =========================================================================
        # env:
        #   PRISM_MONITORING_LITELLM_CALLBACKS: 'langfuse' # e.g. 'langfuse', 'otel', 'langfuse,otel'
        #   LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
        #   LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        #   LANGFUSE_HOST: "https://cloud.langfuse.com" # or self-hosted endpoint URL
        #   OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

