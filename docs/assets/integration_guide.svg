<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B13"/>
      <stop offset="50%" stop-color="#111528"/>
      <stop offset="100%" stop-color="#090B13"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D33"/>
      <stop offset="100%" stop-color="#111424"/>
    </linearGradient>

    <!-- Prism Rainbow Accent Bar -->
    <linearGradient id="prism-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="25%" stop-color="#FF0080"/>
      <stop offset="50%" stop-color="#00DFD8"/>
      <stop offset="75%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#A855F7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #FFFFFF; }
    .header-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #94A3B8; }
    .step-number { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.5px; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #F8FAFC; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
    .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10.5px; fill: #CBD5E1; }
    .code-key { fill: #F472B6; font-weight: 600; }
    .code-val { fill: #38BDF8; }
    .code-comment { fill: #64748B; font-style: italic; }
  </style>

  <!-- Canvas Background -->
  <rect width="1080" height="580" fill="url(#bg-grad)" rx="16"/>
  <rect width="1080" height="4" fill="url(#prism-rainbow)"/>

  <!-- Top Header Section -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#accent-purple)" filter="url(#glow-purple)"/>
    <text x="14" y="31" font-family="sans-serif" font-size="22" fill="#FFFFFF">🌈</text>

    <text x="62" y="24" class="header-title">Integrating Prism Reviewer AI in 3 Easy Steps</text>
    <text x="62" y="43" class="header-subtitle">Automated Multi-Agent Code Reviews &amp; Pluggable Token Telemetry • Developed by Vyoman Labs</text>
  </g>

  <!-- Main Container Grid for 3 Panels -->
  <g transform="translate(40, 110)">

    <!-- ================= STEP 1 PANEL ================= -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="320" height="430" rx="14" fill="url(#card-grad)" stroke="#2D3748" stroke-width="1.5"/>
      
      <!-- Step Badge -->
      <rect x="20" y="20" width="76" height="26" rx="13" fill="url(#accent-purple)"/>
      <text x="32" y="37" class="step-number">STEP 1</text>

      <text x="20" y="74" class="step-title">Add Secrets to Repository</text>
      <text x="20" y="94" class="step-desc">Configure LLM key &amp; optional telemetry in settings.</text>

      <!-- Inner Card Container -->
      <g transform="translate(18, 115)">
        <rect width="284" height="288" rx="10" fill="#0D1117" stroke="#21262D"/>
        
        <!-- Header bar -->
        <rect x="0" y="0" width="284" height="32" rx="10" fill="#161B22"/>
        <text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">Repository Secrets</text>

        <!-- Secret Row 1 -->
        <g transform="translate(12, 42)">
          <rect width="260" height="46" rx="6" fill="#161B22" stroke="#30363D"/>
          <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#58A6FF">LLM_API_KEY</text>
          <text x="12" y="35" font-family="sans-serif" font-size="9.5" fill="#8B949E">Gemini, OpenAI, Anthropic, DeepSeek</text>
          <rect x="216" y="13" width="34" height="20" rx="4" fill="#238636"/>
          <text x="223" y="27" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFF">Set</text>
        </g>

        <!-- Secret Row 2 (Telemetry) -->
        <g transform="translate(12, 96)">
          <rect width="260" height="46" rx="6" fill="#161B22" stroke="#30363D"/>
          <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#A78BFA">LANGFUSE_PUBLIC_KEY</text>
          <text x="12" y="35" font-family="sans-serif" font-size="9.5" fill="#8B949E">Optional: Token Usage Telemetry</text>
          <rect x="216" y="13" width="34" height="20" rx="4" fill="#238636"/>
          <text x="223" y="27" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFF">Set</text>
        </g>

        <!-- Provider Badges Grid -->
        <text x="12" y="162" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#8B949E">Supported LLMs &amp; Telemetry:</text>
        
        <g transform="translate(12, 174)">
          <rect x="0" y="0" width="76" height="22" rx="5" fill="#1F2937" stroke="#374151"/>
          <text x="8" y="15" font-family="sans-serif" font-size="10" fill="#F3F4F6">✨ Gemini</text>

          <rect x="84" y="0" width="76" height="22" rx="5" fill="#1F2937" stroke="#374151"/>
          <text x="92" y="15" font-family="sans-serif" font-size="10" fill="#F3F4F6">🤖 OpenAI</text>

          <rect x="168" y="0" width="92" height="22" rx="5" fill="#1F2937" stroke="#374151"/>
          <text x="176" y="15" font-family="sans-serif" font-size="10" fill="#F3F4F6">🧠 Anthropic</text>

          <rect x="0" y="30" width="84" height="22" rx="5" fill="#1F2937" stroke="#374151"/>
          <text x="8" y="45" font-family="sans-serif" font-size="10" fill="#F3F4F6">🐳 DeepSeek</text>

          <rect x="92" y="30" width="168" height="22" rx="5" fill="#1E1B4B" stroke="#3730A3"/>
          <text x="100" y="45" font-family="sans-serif" font-size="10" fill="#A5B4FC">📈 Langfuse / OpenTelemetry</text>
        </g>
      </g>
    </g>

    <!-- Connector Arrow 1 -> 2 -->
    <g transform="translate(330, 195)">
      <path d="M 0 0 L 22 0" stroke="#4C566A" stroke-width="2" stroke-dasharray="4 4"/>
      <polygon points="22,-4 30,0 22,4" fill="#4C566A"/>
    </g>

    <!-- ================= STEP 2 PANEL ================= -->
    <g transform="translate(360, 0)" filter="url(#shadow)">
      <rect width="320" height="430" rx="14" fill="url(#card-grad)" stroke="#2D3748" stroke-width="1.5"/>
      
      <!-- Step Badge -->
      <rect x="20" y="20" width="76" height="26" rx="13" fill="url(#accent-cyan)"/>
      <text x="32" y="37" class="step-number">STEP 2</text>

      <text x="20" y="74" class="step-title">Create Workflow File</text>
      <text x="20" y="94" class="step-desc">Add <tspan font-family="monospace" font-size="11" fill="#38BDF8">.github/workflows/prism.yml</tspan></text>

      <!-- Code Snippet Box -->
      <g transform="translate(18, 115)">
        <rect width="284" height="288" rx="10" fill="#0D1117" stroke="#21262D"/>
        
        <!-- Header -->
        <rect x="0" y="0" width="284" height="30" rx="10" fill="#161B22"/>
        <circle cx="14" cy="15" r="4" fill="#ED6A5E"/>
        <circle cx="26" cy="15" r="4" fill="#F5BF4F"/>
        <circle cx="38" cy="15" r="4" fill="#62C554"/>
        <text x="52" y="19" font-family="monospace" font-size="10.5" fill="#8B949E">prism-reviewer.yml</text>

        <!-- Code Snippet -->
        <g transform="translate(12, 46)" class="code-text">
          <text x="0" y="0"><tspan class="code-key">name:</tspan> <tspan class="code-val">Prism Reviewer AI</tspan></text>
          <text x="0" y="17"><tspan class="code-key">on:</tspan> [<tspan class="code-val">pull_request</tspan>]</text>
          <text x="0" y="36"><tspan class="code-key">jobs:</tspan></text>
          <text x="12" y="53"><tspan class="code-key">review:</tspan></text>
          <text x="24" y="70"><tspan class="code-key">runs-on:</tspan> <tspan class="code-val">ubuntu-latest</tspan></text>
          <text x="24" y="87"><tspan class="code-key">steps:</tspan></text>
          <text x="34" y="104">- <tspan class="code-key">uses:</tspan> <tspan class="code-val">actions/checkout@v4</tspan></text>
          <text x="44" y="121"><tspan class="code-key">with:</tspan> { <tspan class="code-key">fetch-depth:</tspan> <tspan class="code-val">0</tspan> }</text>
          
          <text x="34" y="142">- <tspan class="code-key">name:</tspan> <tspan class="code-val">Run Prism Reviewer AI</tspan></text>
          <text x="44" y="159"><tspan class="code-key">uses:</tspan> <tspan class="code-val">vyoman-labs/prism-reviewer@v1</tspan></text>
          <text x="44" y="176"><tspan class="code-key">with:</tspan></text>
          <text x="56" y="193"><tspan class="code-key">llm-api-key:</tspan> <tspan class="code-val">${{ secrets.LLM_API_KEY }}</tspan></text>
          <text x="56" y="210"><tspan class="code-key">llm-model-name:</tspan> <tspan class="code-val">'gemini/gemini-2.5-pro'</tspan></text>
          <text x="56" y="227"><tspan class="code-key">enable-monitoring:</tspan> <tspan class="code-val">'auto'</tspan></text>
        </g>
      </g>
    </g>

    <!-- Connector Arrow 2 -> 3 -->
    <g transform="translate(690, 195)">
      <path d="M 0 0 L 22 0" stroke="#4C566A" stroke-width="2" stroke-dasharray="4 4"/>
      <polygon points="22,-4 30,0 22,4" fill="#4C566A"/>
    </g>

    <!-- ================= STEP 3 PANEL ================= -->
    <g transform="translate(720, 0)" filter="url(#shadow)">
      <rect width="320" height="430" rx="14" fill="url(#card-grad)" stroke="#2D3748" stroke-width="1.5"/>
      
      <!-- Step Badge -->
      <rect x="20" y="20" width="76" height="26" rx="13" fill="url(#accent-pink)"/>
      <text x="32" y="37" class="step-number">STEP 3</text>

      <text x="20" y="74" class="step-title">Open PR &amp; Get Reviews</text>
      <text x="20" y="94" class="step-desc">Real-time review output from savourly-recipes #33.</text>

      <!-- Real PR #33 Review Output Box -->
      <g transform="translate(18, 115)">
        <rect width="284" height="288" rx="10" fill="#0D1117" stroke="#21262D"/>
        
        <!-- Summary Header -->
        <rect x="0" y="0" width="284" height="34" rx="10" fill="#161B22"/>
        <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">🌌 Vyoman Labs | 🌈 Prism Reviewer AI</text>

        <!-- PR Metadata Line -->
        <g transform="translate(12, 42)">
          <text x="0" y="11" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#E2E8F0">Pull Request: <tspan fill="#60A5FA">#33 - random recipe feature</tspan></text>
          
          <!-- Agent Badges -->
          <g transform="translate(0, 18)">
            <rect x="0" y="0" width="72" height="18" rx="4" fill="#312E81"/>
            <text x="6" y="13" font-family="sans-serif" font-size="9" font-weight="600" fill="#C7D2FE">👮 Warden</text>

            <rect x="78" y="0" width="76" height="18" rx="4" fill="#064E3B"/>
            <text x="84" y="13" font-family="sans-serif" font-size="9" font-weight="600" fill="#A7F3D0">📐 Architect</text>

            <rect x="160" y="0" width="76" height="18" rx="4" fill="#701A75"/>
            <text x="166" y="13" font-family="sans-serif" font-size="9" font-weight="600" fill="#F5D0FE">🔍 Inspector</text>
          </g>

          <text x="0" y="50" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#F87171">Findings: 5 total (⚠️ 2 major · 💡 3 advisory)</text>
        </g>

        <!-- Real Inline Comment Payload (from PR #33) -->
        <g transform="translate(12, 106)">
          <rect width="260" height="135" rx="8" fill="#161B22" stroke="#30363D"/>
          
          <!-- Comment Header -->
          <rect x="0" y="0" width="260" height="26" rx="8" fill="#1C2128"/>
          <text x="10" y="17" font-family="sans-serif" font-size="10" font-weight="700" fill="#F59E0B">📐 Architect (⚠️ MAJOR)</text>
          
          <!-- Real Comment Body from PR 33 -->
          <text x="10" y="42" font-family="sans-serif" font-size="9" fill="#E2E8F0">The selectRandomMatching method</text>
          <text x="10" y="56" font-family="sans-serif" font-size="9" fill="#E2E8F0">iterates over the entire recipe list for</text>
          <text x="10" y="70" font-family="sans-serif" font-size="9" fill="#E2E8F0">every random request, which will cause</text>
          <text x="10" y="84" font-family="sans-serif" font-size="9" fill="#E2E8F0">performance degradation as data grows.</text>

          <!-- Footer Signature -->
          <line x1="10" y1="98" x2="250" y2="98" stroke="#30363D" stroke-width="1"/>
          <text x="10" y="116" font-family="sans-serif" font-size="8.5" font-style="italic" fill="#8B949E">Prism Reviewer AI v1.1.0</text>
        </g>

        <!-- Telemetry Status Pill -->
        <g transform="translate(12, 250)">
          <rect width="260" height="26" rx="6" fill="#064E3B" stroke="#047857"/>
          <text x="10" y="17" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#6EE7B7">📈 Telemetry Active: Langfuse &amp; OTel Logged</text>
        </g>
      </g>
    </g>

  </g>
</svg>
