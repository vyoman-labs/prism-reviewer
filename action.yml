name: 'Prism Reviewer AI'
description: 'Resilient and automated multi-agent code review powered by Prism Reviewer AI'
author: 'Vyoman Labs'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  llm-api-key:
    description: 'API key for your LLM Provider (Gemini, OpenRouter, OpenAI, Anthropic, etc.)'
    required: true
  llm-model-name:
    description: 'LiteLLM model identifier to perform code analysis'
    required: false
    default: 'gemini/gemini-3.1-flash-lite'
  github-token:
    description: 'GitHub Token for posting review comments (App Token, PAT, or default GITHUB_TOKEN)'
    required: false
    default: ''
  app-id:
    description: 'GitHub App ID (used to generate installation token if github-token is not set)'
    required: false
  private-key:
    description: 'GitHub App Private Key (used to generate installation token if github-token is not set)'
    required: false
  owner:
    description: 'Repository owner for GitHub App installation token (defaults to github.repository_owner)'
    required: false
    default: ${{ github.repository_owner }}
  base-ref:
    description: 'Base branch or commit reference for comparison'
    required: false
    default: ${{ github.base_ref }}
  agents-mode:
    description: 'Execution mode for review agents (parallel or sequential)'
    required: false
    default: 'parallel'

runs:
  using: 'composite'
  steps:
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Prism Reviewer
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}" || pip install prism-reviewer || pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ prism-reviewer

    - name: Generate GitHub App Token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.private-key != '' }}
      uses: actions/create-github-app-token@v1
      continue-on-error: true
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}

    - name: Resolve GitHub Token
      id: resolve-token
      shell: bash
      run: |
        if [ -n "${{ steps.app-token.outputs.token }}" ]; then
          echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
          echo "app_token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
          echo "::notice::Using GitHub App token for posting review comments."
        else
          if [ -n "${{ inputs.app-id }}" ] || [ -n "${{ inputs.private-key }}" ]; then
            echo "::warning::GitHub App credentials (app-id / private-key) were provided, but actions/create-github-app-token failed to generate an installation token. Please verify the App is installed on target repository/owner with 'Pull Requests: Read & write' permissions. Falling back to default repository GITHUB_TOKEN."
          fi
          if [ -n "${{ inputs.github-token }}" ]; then
            echo "token=${{ inputs.github-token }}" >> $GITHUB_OUTPUT
            echo "app_token=" >> $GITHUB_OUTPUT
            echo "::notice::Using provided github-token for posting review comments."
          else
            echo "token=${{ github.token }}" >> $GITHUB_OUTPUT
            echo "app_token=" >> $GITHUB_OUTPUT
            echo "::notice::Using default repository GITHUB_TOKEN for posting review comments."
          fi
        fi

    - name: Run AI Code Review Engine
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        LLM_PROVIDER_API_KEY: ${{ inputs.llm-api-key }}
        LLM_MODEL: ${{ inputs.llm-model-name }}
        GITHUB_TOKEN: ${{ steps.resolve-token.outputs.token }}
        GITHUB_APP_TOKEN: ${{ steps.resolve-token.outputs.app_token }}
        AGENTS_MODE: ${{ inputs.agents-mode }}
      run: |
        BASE_TARGET="${{ inputs.base-ref }}"
        if [ -z "$BASE_TARGET" ]; then
          BASE_TARGET="main"
        fi
        git fetch origin "$BASE_TARGET" --depth=50 || git fetch origin --depth=50 || true
        echo "Executing prism-review against base: origin/$BASE_TARGET"
        prism-review --pr --base "origin/$BASE_TARGET" || prism-review --pr --base "$BASE_TARGET" || prism-review --pr --base "HEAD~1"

    - name: Publish Review Comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.resolve-token.outputs.token }}
        GITHUB_APP_TOKEN: ${{ steps.resolve-token.outputs.app_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ -f "reports/prism_review_report.md" ]; then
          export REPORT_FILE_PATH="reports/prism_review_report.md"
        elif [ -f "prism_review_report.md" ]; then
          export REPORT_FILE_PATH="prism_review_report.md"
        fi

        if [ -n "$REPORT_FILE_PATH" ]; then
          echo "Publishing report from $REPORT_FILE_PATH to PR #${PR_NUMBER} in ${GITHUB_REPOSITORY}..."
          python "${{ github.action_path }}/scripts/post_review.py"
        else
          echo "::warning::No Prism Reviewer report file found to publish."
        fi
