[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-reviewer"
version = "1.1.0"
description = "A resilient and automated multi-agent code review tool powered by LLMs, developed by Vyoman Labs."
authors = [{ name = "Vyoman Labs" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "PyGithub>=2.0.0",
    "requests>=2.25.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c>=0.23.4",
    "tree-sitter-go>=0.23.4",
    "tree-sitter-rust>=0.23.2",
    "tree-sitter-yaml>=0.7.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-json>=0.24.0",
    "tree-sitter-bash>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/vyoman-labs/prism-reviewer"
Repository = "https://github.com/vyoman-labs/prism-reviewer"
Documentation = "https://github.com/vyoman-labs/prism-reviewer#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "anyio>=4.0.0",
    "vcrpy>=6.0.0",
]
langfuse = [
    "langfuse>=2.0.0,<3.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
monitoring = [
    "langfuse>=2.0.0,<3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]


[project.scripts]
prism-review = "prism_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism_reviewer*"]

[tool.setuptools.package-data]
prism_reviewer = ["prism_reviewer.toml", "agents/prompts/*.md"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
]

